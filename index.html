<!doctype html>
<!-- Step 7 viewer (docs/WEB_VIEWER.md): worker-owned editor.wasm, tiled page
     painting (§5), hidden-input IME sink (§7), newest-wins latch (§9).
     Plain ES modules for now; the TS build arrives with the real viewer.
     Serve the REPO ROOT so /wasm/dist and /wasm/testdata resolve: e.g.
     python -m http.server 8734  → open  http://localhost:8734/web/ -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pdfium-editor — web viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #9e9e9e; font-family: system-ui, sans-serif; }
    #bar { position: fixed; inset: 0 0 auto 0; height: 44px; background: #673ab7; color: #fff;
           display: flex; align-items: center; gap: 10px; padding: 0 12px; z-index: 2; }
    #bar input[type=file] { color: #fff; max-width: 220px; }
    #bar button { background: #fff2; color: #fff; border: 1px solid #fff5; border-radius: 4px;
                  width: 28px; height: 28px; font-size: 16px; cursor: pointer; }
    #zoomlabel { min-width: 44px; text-align: center; font-size: 13px; }
    #status { font-size: 13px; opacity: .9; flex: 1; }
    #opfsbadge { font-size: 12px; background: #ffca28; color: #4a2c00; border-radius: 3px;
                 padding: 2px 6px; white-space: nowrap; }
    #opfsbadge[hidden] { display: none; }
    #imelog { position: fixed; inset: auto 0 0 0; background: #0009; color: #9f9;
              font: 12px/1.6 monospace; padding: 2px 10px; z-index: 2; min-height: 20px; }
    #strip { padding: 56px 0 40px; display: flex; flex-direction: column; align-items: center; gap: 14px;
             position: relative; /* the faint-box layer positions inside it */ }
    #strip canvas { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.45); display: block; }
    /* Faint paragraph boxes (edit mode) — the Android overlay's analog. They
       live inside #strip so they scroll with the pages for free; the open
       run's box is omitted while it is being edited. */
    .parabox { position: absolute; border: 1px solid #3f51b566; background: #3f51b50d;
               pointer-events: none; border-radius: 1px; }
    #editmode { width: auto !important; padding: 0 10px; }
    #editmode.active { background: #fff; color: #673ab7; font-weight: 600; }
    /* Selection handles: the app's round knobs (never the OS teardrops),
       hanging under the selection ends, draggable. */
    .handle { position: fixed; width: 18px; height: 18px; border-radius: 50%;
              background: #3f51b5; border: 2px solid #fff; box-shadow: 0 1px 4px #0007;
              z-index: 3; display: none; touch-action: none; cursor: grab; }
    /* The IME sink (§7): 1x1, transparent, positioned at the caret. NEVER a
       visible editor — it exists only to summon the keyboard and receive
       keystrokes/composition. pointer-events:none is LOAD-BEARING (I9): the
       sink sits exactly where the user taps next (the caret), and with
       hit-testing on it swallows that tap — the canvas never sees it, so the
       caret doesn't move and commit-on-tap-outside doesn't fire. Programmatic
       focus() still works on a pointer-events:none element. */
    #sink { position: fixed; left: -100px; top: -100px; width: 1px; height: 1px;
            padding: 0; border: 0; outline: 0; background: transparent; color: transparent;
            caret-color: transparent; resize: none; overflow: hidden; z-index: 1;
            pointer-events: none;
            font-size: 16px; /* prevents iOS focus-zoom */ }
    /* Save-fallback warning (docs/WEB_IO.md §7): shown when the browser has no
       OPFS sync handle, so the save cannot stream and holds the whole output
       in memory. Blocking on purpose — the user chooses before we spend it. */
    #warn { position: fixed; inset: 0; background: #0007; z-index: 4; display: none;
            align-items: center; justify-content: center; }
    #warn.show { display: flex; }
    #warnbox { background: #fff; color: #222; max-width: 460px; padding: 18px 20px;
               border-radius: 8px; box-shadow: 0 6px 30px #0006; font-size: 14px; line-height: 1.5; }
    #warnbox h3 { margin: 0 0 8px; font-size: 15px; }
    #warnbtns { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
    #warnbtns button { padding: 6px 14px; border-radius: 4px; border: 1px solid #bbb;
                       background: #f3f3f3; cursor: pointer; font-size: 13px; }
    /* Must out-specify `#warnbtns button` above (id+element beats a bare id) —
       otherwise the primary button renders white-on-white. */
    #warnbtns button#warnok { background: #673ab7; color: #fff; border-color: #673ab7; }
    #warnbtns button#warnok[hidden] { display: none; }
    /* Caret + selection overlays (§6): drawn by the viewer from CORE geometry
       (page points -> CSS), never from browser text metrics. */
    #caret { position: fixed; width: 2px; background: #000; z-index: 1;
             display: none; pointer-events: none; animation: caretblink 1s steps(1) infinite; }
    @keyframes caretblink { 50% { opacity: 0; } }
    .selrect { position: fixed; background: #3f51b555; z-index: 1; pointer-events: none; }
  </style>
</head>
<body>
  <div id="bar">
    <strong>pdfium-editor</strong>
    <input id="file" type="file" accept="application/pdf">
    <button id="zout" title="zoom out">−</button>
    <span id="zoomlabel">100%</span>
    <button id="zin" title="zoom in">+</button>
    <button id="editmode" title="toggle edit mode">✎ Edit</button>
    <!-- Per-paragraph line mode (Android btnLineMode parity): visible only
         while a multi-line paragraph is open AND the config checkbox is on
         (production stays heuristic-only). -->
    <button id="linemode" hidden
            title="toggle reflow / keep-lines for this paragraph"
            style="width:auto;padding:0 10px">¶ Reflow</button>
    <label id="lmconfig" title="config: show the line-mode toggle while editing"
           style="font-size:12px;white-space:nowrap">
      <input type="checkbox" id="lmtoggleconf"> mode btn
    </label>
    <button id="save" title="save PDF" style="width:auto;padding:0 10px">Save</button>
    <!-- Persistent §7 badge: unlike #status (which every paint overwrites),
         this stays visible for as long as saves cannot stream. -->
    <span id="opfsbadge" hidden title="This browser has no OPFS sync handle: saves are held in memory">⚠ in-memory saves</span>
    <span id="status">loading engine…</span>
  </div>
  <div id="strip"></div>
  <div id="caret"></div>
  <div id="selrects"></div>
  <div class="handle" id="h0"></div>
  <div class="handle" id="h1"></div>
  <textarea id="sink" autocapitalize="off" autocomplete="off" autocorrect="off"
            spellcheck="false" aria-hidden="true" tabindex="-1"></textarea>
  <div id="warn">
    <div id="warnbox">
      <h3 id="warntitle">Saving without streaming</h3>
      <div id="warntext"></div>
      <div id="warnbtns">
        <button id="warncancel">Cancel</button>
        <button id="warnok">Save anyway</button>
      </div>
    </div>
  </div>
  <div id="imelog">view mode — click ✎ Edit to enable editing</div>
  <script type="module" src="main.js?v=2a5cbd7"></script>
</body>
</html>
